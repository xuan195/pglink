name: Verify Action Pins

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/verify-action-pins.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/verify-action-pins.sh'
  schedule:
    - cron: '0 3 * * 1'  # weekly, in case an upstream tag is deliberately moved
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Fork guard (local-only, do not sync upstream): this mirror fork skips
    # the pin-drift check. Action tag movement is upstream's supply-chain
    # housekeeping (their dependabot bumps the pins); on the fork it only
    # produces red runs between upstream updates.
    if: github.repository == 'semantica-agi/semantica'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify pinned action SHAs match their tag comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-action-pins.sh
